[project]
name = "martini"
version = "0.1.0"
description = "MARTINI — an AI agent that treats a film shooting day as a production system it is on call for."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emitter*"]
